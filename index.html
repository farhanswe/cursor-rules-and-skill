<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — cursorSkill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1419;
      color: #e6edf3;
      padding: 2rem;
    }
    main {
      max-width: 32rem;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #8b949e; line-height: 1.6; margin-bottom: 1.5rem; }
    ul {
      list-style: none;
      text-align: left;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    li { padding: 0.35rem 0; color: #c9d1d9; }
    li strong { color: #58a6ff; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>Cursor rules and skills for smarter AI workflows in this workspace.</p>
    <ul>
      <li><strong>auto-commit-push</strong> — commit and push after changes</li>
      <li><strong>no-write-folder</strong> — protect paths from AI writes</li>
      <li><strong>token-budget</strong> — lean context and focused edits</li>
    </ul>
  </main>
</body>
</html>
